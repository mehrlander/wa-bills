<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSL Sync Utility</title>
    <link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5,npm/tabulator-tables/dist/css/tabulator_simple.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/combine/npm/jquery,npm/luxon,npm/@tailwindcss/browser@4,npm/clipboard,npm/@phosphor-icons/web,npm/jszip,npm/tabulator-tables"></script>
    <script type="module">
        import { diff } from 'https://cdn.jsdelivr.net/npm/jsondiffpatch@0.6.0/+esm';
        window.diffpatch = diff;
        import 'https://cdn.jsdelivr.net/gh/mehrlander/wa-bills@main/legislation/tools/data-drop-2.js';
    </script>
</head>
<body class="h-screen flex flex-col bg-base-100 overflow-hidden text-[16px]">

<header id="h-main" class="flex items-center gap-8 px-6 h-16 border-b border-base-300 shrink-0"></header>

<main class="flex-1 flex flex-col min-h-0">
    <div id="h-sub" class="flex items-center gap-3 px-4 h-14 border-b border-base-300 shrink-0"></div>
    
    <div id="out-wrap" class="relative flex-1 bg-neutral min-h-0 flex flex-col overflow-hidden">
        <div class="flex-1 border-b border-base-content/10 relative overflow-hidden bg-neutral">
             <div id="sync-progress" class="hidden absolute inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-sm">
                <div class="bg-base-100 p-8 rounded-2xl shadow-2xl flex flex-col items-center gap-4 border border-base-300">
                    <span class="loading loading-spinner loading-lg text-primary"></span>
                    <div class="text-center">
                        <div class="font-black text-2xl tracking-tighter uppercase" id="sync-msg">Processing</div>
                        <div class="font-mono text-sm opacity-60 mt-1" id="sync-count">0 / 0</div>
                    </div>
                </div>
             </div>
             <pre id="out" class="absolute inset-0 p-4 text-info font-mono text-[11px] overflow-auto outline-none selection:bg-info/10" tabindex="0"></pre>
        </div>
        <div id="grid" class="bg-base-100 shrink-0 border-t border-base-300"></div>
    </div>
</main>

<script type="module">
import { 
    getLegislation, getPrefiles, getSponsors, getRcwFor, getActionsFor, getHistoryFor,
    joinRcw, joinActions, joinHistory, joinSponsors, getBillNumber, transform, consolidate, ABBR 
} from 'https://cdn.jsdelivr.net/gh/mehrlander/wa-bills@main/legislation/tools/wsl-api-01.js';

const { DateTime } = luxon;
const BIENNIUM = '2025-26';

window.store = { legislation: [], prefiles: [], sponsors: [], rcws: {}, actions: {}, history: {} };
window.view = { mode: 'legislation', format: 'json' };
let syncing = false, table = null;

const getProfile = (rows) => {
    if (!rows?.length) return [];
    const keys = [...new Set(rows.flatMap(Object.keys))];
    const total = rows.length;
    return keys.map(k => {
        const vals = rows.map(r => r[k]).filter(v => v != null && String(v).trim() !== "");
        return { column: k, count: vals.length, unique: [...new Set(vals)].length, pct: ((vals.length / total) * 100).toFixed(0) + '%', sample: [...new Set(vals)].slice(0, 5).join(', ') };
    });
};

const performRender = () => {
    const all = [...store.legislation, ...store.prefiles];
    let data;
    if (view.mode === 'join') {
        const spMap = Object.fromEntries(store.sponsors.map(s => [s.Id, s]));
        data = all.map(b => { 
            const j = {...b}; joinRcw(j, store.rcws); joinActions(j, store.actions); joinHistory(j, store.history); joinSponsors(j, spMap); return j; 
        });
    } else if (['rcws','actions','history'].includes(view.mode)) {
        data = view.mode === 'rcws' ? Object.values(store.rcws) : Object.values(store[view.mode]).flat();
    } else { data = store[view.mode]; }

    const curSince = $('#sinceDate').val() || '2025-01-01';
    const curIter = $('#maxIterations').val() || '10';
    const curLimit = $('#limitEnabled').length ? $('#limitEnabled').is(':checked') : true;

    $('#h-main').html(`
        <div class="flex items-center gap-3 h-10 border-l border-base-300 pl-6"><span class="text-[10px] font-black opacity-30 uppercase tracking-widest leading-none">Sources</span><div class="flex gap-0">
            <button data-mode="legislation" class="btn btn-sm font-bold gap-2 rounded-r-none ${view.mode==='legislation'?'btn-primary':'btn-ghost'}">Legislation <span class="badge badge-xs">${store.legislation.length}</span></button>
            <button data-mode="prefiles" class="btn btn-sm font-bold gap-2 rounded-l-none border-l-0 ${view.mode==='prefiles'?'btn-primary':'btn-ghost'}">Prefiles <span class="badge badge-xs">${store.prefiles.length}</span></button>
        </div></div>
        <div class="flex items-center gap-3 h-10 border-l border-base-300 pl-6"><span class="text-[10px] font-black opacity-30 uppercase tracking-widest leading-none">Lookups</span><div class="flex gap-2">
            <button data-mode="rcws" class="btn btn-xs font-bold ${view.mode==='rcws'?'btn-primary':'btn-ghost'}">RCW <span class="opacity-50">${Object.keys(store.rcws).length}/${all.length}</span></button>
            <button data-mode="actions" class="btn btn-xs font-bold ${view.mode==='actions'?'btn-primary':'btn-ghost'}">Act <span class="opacity-50">${Object.keys(store.actions).length}</span></button>
            <button data-mode="history" class="btn btn-xs font-bold ${view.mode==='history'?'btn-primary':'btn-ghost'}">Hist <span class="opacity-50">${Object.keys(store.history).length}</span></button>
            <button data-mode="sponsors" class="btn btn-xs font-bold ${view.mode==='sponsors'?'btn-primary':'btn-ghost'}">Sponsors <span class="badge badge-xs">${store.sponsors.length}</span></button>
        </div></div>
        <div class="ml-auto flex items-center gap-4"><button data-mode="join" class="btn btn-sm font-bold ${view.mode==='join'?'btn-primary':'btn-ghost'}">Join All</button></div>
    `);

    $('#h-sub').html(`
        <div class="flex items-center gap-3">
            <button data-mode="sync" ${syncing?'disabled':''} class="btn btn-sm font-bold gap-2 ${syncing?'btn-ghost opacity-30':'btn-primary'}"><i class="ph-bold ph-arrows-clockwise text-xl"></i><span>${syncing?'Syncing...':'Sync View'}</span></button>
            ${view.mode==='legislation'?'<input type="date" id="sinceDate" class="input input-sm input-bordered h-10">':''}
            ${['rcws','actions','history'].includes(view.mode)? `
                <div class="flex items-center gap-2 h-10 px-3 border border-base-300 rounded-lg">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="limitEnabled" class="checkbox checkbox-xs checkbox-primary"><span class="text-xs font-bold opacity-70">Limit</span></label>
                    <input type="number" id="maxIterations" class="input input-xs w-16 text-center bg-transparent border-none focus:ring-0 font-mono">
                </div>
            ` : ''}
            ${view.mode==='sponsors'?'<input type="text" id="biennium" value="2025-26" class="input input-sm input-bordered w-24 text-center font-mono">':''}
        </div>
        <div class="ml-auto flex items-center gap-1">
            <div class="join">${['json','tsv'].map(f=>`<button data-fmt="${f}" class="btn btn-sm join-item ${view.format===f?'btn-primary':'btn-ghost'} font-bold">${f.toUpperCase()}</button>`).join('')}</div>
            <button data-mode="copy" class="btn btn-ghost btn-sm btn-square"><i class="ph-bold ph-copy text-xl"></i></button>
            <button data-mode="clear" class="btn btn-ghost btn-sm btn-square"><i class="ph-bold ph-trash text-xl"></i></button>
        </div>
    `);

    $('#sinceDate').val(curSince); $('#maxIterations').val(curIter); $('#limitEnabled').prop('checked', curLimit);
    $('#out').text(view.format==='tsv' ? (window.xl?.toTsv(data)||JSON.stringify(data)) : JSON.stringify(data, null, 2));
    if (!table) table = new Tabulator("#grid", { data: getProfile(data), layout: "fitColumns", columns: [{title:"Column", field:"column", headerFilter:"input"},{title:"Populated", field:"count"},{title:"Unique", field:"unique"},{title:"Fill", field:"pct"},{title:"Sample", field:"sample"}], height: 300 });
    else table.setData(getProfile(data));
};

const runSync = async () => {
    const isLimited = $('#limitEnabled').length ? $('#limitEnabled').is(':checked') : false;
    const iterCount = parseInt($('#maxIterations').val()) || 10;
    const sinceDate = $('#sinceDate').val();
    const biennium = $('#biennium').val() || BIENNIUM;

    syncing = true; performRender();
    const all = [...store.legislation, ...store.prefiles];

    try {
        if (['rcws','actions','history'].includes(view.mode)) {
            let miss = [];
            if (view.mode === 'rcws') miss = all.filter(b => !store.rcws[b.BillId]);
            else {
                const unique = [...new Map(all.map(b => [getBillNumber(b), b])).values()];
                miss = unique.filter(b => !store[view.mode][getBillNumber(b)]);
            }

            if (isLimited) miss = miss.slice(0, iterCount);

            if (miss.length > 0) {
                // Show progress and update text directly
                $('#sync-progress').removeClass('hidden');
                $('#sync-msg').text(`Fetching ${view.mode.toUpperCase()}...`);
                
                for (let i = 0; i < miss.length; i++) {
                    const b = miss[i];
                    // Direct DOM update of counter (Performance optimal)
                    $('#sync-count').text(`${i + 1} / ${miss.length} [${b.BillId || getBillNumber(b)}]`);
                    
                    if (view.mode === 'rcws') {
                        const r = await getRcwFor(b, biennium);
                        if (r) store.rcws[r.BillId] = r;
                    } else {
                        const bn = getBillNumber(b);
                        const data = view.mode === 'actions' ? await getActionsFor(b, biennium) : await getHistoryFor(b, biennium);
                        store[view.mode][bn] = data;
                    }
                }
            }
        } else if (view.mode === 'sponsors') {
            store.sponsors = await getSponsors(biennium);
        } else {
            const raw = view.mode === 'legislation' ? await getLegislation(sinceDate) : await getPrefiles();
            store[view.mode] = consolidate(raw);
        }
    } catch (e) { console.error(e); }

    $('#sync-progress').addClass('hidden');
    syncing = false; 
    performRender(); // Final calculation and table draw
};

$(document).on('click', '[data-mode]', function() {
    const m = $(this).data('mode');
    if (m === 'sync') runSync();
    else if (m === 'clear') { 
        if(['rcws','actions','history'].includes(view.mode)) store[view.mode]={}; else store[view.mode]=[]; 
        performRender(); 
    }
    else if (m === 'copy') navigator.clipboard.writeText($('#out').text());
    else { view.mode = m; performRender(); }
}).on('click', '[data-fmt]', function() { view.format = $(this).data('fmt'); performRender(); });

performRender();
</script>
</body>
</html>
