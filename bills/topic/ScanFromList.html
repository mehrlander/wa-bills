<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Fetcher</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/@tailwindcss/browser@4,npm/lodash"></script>
<script type="module">
    import { XMLParser } from 'https://cdn.jsdelivr.net/npm/fast-xml-parser@4.3.6/+esm';
    window.XMLParser = XMLParser;
</script>
<script defer src="https://unpkg.com/alpinejs"></script>
</head>
<body class="bg-base-200 h-screen p-4 text-sm text-base-content">
<div x-data="fetcher()" class="h-full flex flex-col gap-4">
  
  <div class="flex gap-4 flex-1 min-h-0">
    <div class="w-1/3 flex flex-col gap-2">
      <div class="flex justify-between items-end">
        <span class="text-xs font-bold uppercase opacity-70">Input JSON</span>
        <span class="text-xs opacity-60" x-text="`${queue.length} bills`"></span>
      </div>
      <textarea x-model="inputJson" @input="parseInput()" 
        class="textarea textarea-bordered font-mono text-xs w-full flex-1" 
        placeholder='[{"biennium":"2025-26","billNumber":"5835"},...]'></textarea>
      <div class="flex gap-2">
        <button @click="fetchAll()" :disabled="fetching || !queue.length" 
          class="btn btn-primary btn-sm flex-1" x-text="fetching ? 'Fetching...' : 'Fetch All'"></button>
        <button @click="results=[]; displayJson=''; inputJson=''; queue=[]" class="btn btn-ghost btn-sm">Clear</button>
      </div>
      <div x-show="parseError" class="text-error text-xs" x-text="parseError"></div>
    </div>
    
    <div class="w-2/3 flex flex-col gap-2">
      <div class="flex justify-between items-end">
        <span class="text-xs font-bold uppercase opacity-70">Results</span>
        <div class="flex gap-2 items-center">
          <span class="text-xs opacity-60" x-text="`${results.length} fetched`"></span>
          <button @click="copyResults()" x-show="results.length" class="btn btn-xs btn-outline">Copy</button>
        </div>
      </div>
      <div class="mockup-code bg-neutral text-neutral-content flex-1 overflow-auto text-xs">
        <pre class="px-4"><code x-text="displayJson"></code></pre>
      </div>
    </div>
  </div>

  <div x-show="fetching" class="flex items-center gap-2 text-xs">
    <span class="loading loading-spinner loading-xs"></span>
    <span x-text="status"></span>
  </div>

</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('fetcher', () => ({
    inputJson: '',
    queue: [],
    results: [],
    displayJson: '',
    fetching: false,
    status: '',
    parseError: '',

    parseInput() {
      this.parseError = '';
      try {
        const data = JSON.parse(this.inputJson || '[]');
        this.queue = data.map(d => ({ biennium: d.biennium, billNumber: String(d.billNumber) }));
      } catch (e) {
        this.parseError = e.message;
        this.queue = [];
      }
    },

    billUrl(biennium, billNumber) {
      const num = parseInt(billNumber);
      const chamber = num >= 5000 ? 'Senate' : 'House';
      return `https://lawfilesext.leg.wa.gov/Biennium/${biennium}/Htm/Bills/${chamber}%20Bills/${billNumber}.htm`;
    },

    async fetchAll() {
      this.fetching = true;
      this.results = [];
      this.displayJson = 'Fetching...';
      for (const item of this.queue) {
        this.status = `Fetching ${item.billNumber}... (${this.results.length + 1}/${this.queue.length})`;
        const result = await this.extractBill(item.biennium, item.billNumber);
        this.results.push(result);
        await new Promise(r => setTimeout(r, 200));
      }
      this.displayJson = JSON.stringify(this.results, null, 2);
      this.status = '';
      this.fetching = false;
    },

    async extractBill(biennium, billNumber) {
      const htmUrl = this.billUrl(biennium, billNumber);
      const xmlUrl = htmUrl.replace(/\/Htm\//i, '/Xml/').replace(/\.htm$/i, '.xml');
      try {
        const [hRes, xRes] = await Promise.all([
          fetch(htmUrl), 
          fetch(xmlUrl).catch(() => null)
        ]);
        if (!hRes.ok) return { biennium, billNumber, url: htmUrl, error: `HTTP ${hRes.status}` };
        const [html, xml] = await Promise.all([
          hRes.text(), 
          xRes?.ok ? xRes.text() : null
        ]);
        const doc = new DOMParser().parseFromString(html, 'text/html');
        
        const clean = el => el?.textContent.trim() || null;
        const fullBill = clean(doc.querySelector('div[style*="bold;text-align:center;"]'));
        
        const getPrefiled = () => {
          const readSpan = Array.from(doc.querySelectorAll('span'))
            .find(s => s.textContent.trim().startsWith('Read first time'));
          const data = {};
          if (readSpan) {
            (readSpan.closest('div') || readSpan.parentElement).querySelectorAll('span').forEach(s => {
              const t = s.textContent.trim();
              if (t.startsWith('Prefiled')) data.prefiled = t.split('Prefiled ')[1];
              if (t.startsWith('Read first time')) data.firstRead = t.split('Read first time ')[1];
              if (t.startsWith('Referred to')) data.referredTo = t.split('Referred to ')[1];
            });
          }
          return data;
        };

        const rcws = new Set();
        doc.querySelectorAll('a[href*="app.leg.wa.gov/RCW"]').forEach(a => {
          const text = a.textContent.trim();
          if (text) rcws.add(text);
        });

        // Term frequencies
        const words = doc.body.textContent.toLowerCase().match(/[a-z]{3,}/g) || [];
        const termFreq = {};
        words.forEach(w => termFreq[w] = (termFreq[w] || 0) + 1);

        // XML BillHeading
        let xmlHeading = null;
        if (xml && window.XMLParser) {
          const xmlDoc = new DOMParser().parseFromString(xml, "application/xml");
          const parser = new window.XMLParser({ ignoreAttributes: false, attributeNamePrefix: "@", removeNSPrefix: true });
          xmlHeading = parser.parse(new XMLSerializer().serializeToString(xmlDoc)).Bill?.BillHeading || null;
        }

        return {
          biennium,
          billNumber,
          url: htmUrl,
          billTitle: fullBill,
          ...getPrefiled(),
          sponsors: doc.querySelector('span[style*="font-weight:bold"]')?.nextSibling?.textContent.trim() || null,
          title: clean(doc.querySelector('div[style*="text-indent:0.5in;margin-top:0.5in;"]')),
          rcwsLinked: [...rcws].sort(),
          termFreq,
          xmlHeading
        };
      } catch (e) {
        return { biennium, billNumber, url: htmUrl, error: e.message };
      }
    },

    copyResults() {
      navigator.clipboard.writeText(this.displayJson || JSON.stringify(this.results, null, 2));
    }
  }));
});
</script>
</body>
</html>
