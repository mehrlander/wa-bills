<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Extractor v3</title>
<link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5,npm/tabulator-tables/dist/css/tabulator_simple.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/combine/npm/tabulator-tables,npm/lodash,npm/@tailwindcss/browser@4,npm/@phosphor-icons/web,npm/dexie@4"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script type="module">
    import { XMLParser } from 'https://cdn.jsdelivr.net/npm/fast-xml-parser@4.3.6/+esm';
    window.XMLParser = XMLParser;
</script>
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-base-100 text-base-content h-screen w-screen overflow-hidden font-sans antialiased">
<div x-data="extractor()" class="flex flex-col md:flex-row h-full w-full">
  
  <div class="w-full md:w-2/5 h-full flex flex-col border-r border-base-300 bg-base-100 min-w-0">
      <div class="p-2 bg-base-200 border-b border-base-300 flex flex-col gap-1.5">
          <div class="flex justify-between items-end px-1">
              <h1 class="font-bold text-[10px] uppercase tracking-widest opacity-70 flex items-center gap-1.5">
                 <i class="ph ph-list-magnifying-glass text-primary"></i> Staging
              </h1>
              <div class="text-[9px] opacity-50 font-mono" x-html="dbStatus"></div>
          </div>
          
          <div class="join w-full shadow-sm">
              <input type="text" x-model="targetUrl" @keydown.enter="scanDirectory()" class="input input-xs input-bordered join-item w-full font-mono text-[10px]" />
              <button @click="scanDirectory()" class="btn btn-xs btn-primary join-item" :disabled="scanning || batchScanning">List</button>
          </div>

          <div class="flex justify-between items-start px-1 h-6">
             <div class="flex flex-col leading-[1.1] text-[10px] opacity-70">
                 <span x-text="`${files.length} files`"></span>
                 <span x-show="files.length" class="text-success font-semibold" x-text="`${getStoredCount()} stored`"></span>
             </div>
             <div class="flex gap-1" x-show="files.length">
                 <button @click="batchScanning ? stopBatchScan() : startBatchScan()" 
                         :class="batchScanning ? 'btn-error animate-pulse' : 'btn-outline border-base-content/10'" 
                         class="btn btn-xs text-[9px] h-6 min-h-0" x-text="batchScanning ? 'Stop' : 'Import All'"></button>
                 <button @click="smartScroll()" class="btn btn-xs btn-ghost bg-base-300/50 hover:bg-base-300 text-[9px] h-6 min-h-0 gap-1">
                    <i class="ph ph-arrow-down"></i> Scroll
                 </button>
             </div>
          </div>
      </div>
      <div id="fileTable" class="bg-base-100 focus:outline-none"></div>
  </div>

  <div class="w-full md:w-3/5 h-full flex flex-col bg-base-100 border-l border-base-300 min-h-0">
      <div class="p-2 border-b border-base-300 flex justify-between items-center h-10 shrink-0">
          <div class="leading-none flex flex-col px-1">
              <h2 class="font-bold text-[10px] uppercase tracking-widest opacity-60">SessionBills v3</h2>
              <div class="text-[9px] font-mono flex gap-2 mt-0.5 opacity-40">
                  <span x-text="`${docCount} Docs`"></span>
                  <span x-text="`${termCount} Terms`"></span>
              </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
             <div x-show="analyzing || batchScanning" class="text-[9px] font-bold animate-pulse text-info mr-2">BUSY</div>
             <button @click="showIndex()" class="btn btn-xs btn-ghost border-base-content/5 h-6 min-h-0 text-[10px] normal-case">Show Index</button>
             <button @click="copyVisibleData()" class="btn btn-xs btn-outline border-base-content/20 h-6 min-h-0 gap-1 text-[10px]">
                 <span x-text="copyText">Copy</span>
                 <i class="ph ph-copy opacity-40 text-[9px]"></i>
             </button>
          </div>
      </div>
      
      <div class="flex-grow overflow-hidden p-2 bg-base-200/40">
          <div x-show="docCount === 0 && !currentDoc" class="h-full flex flex-col items-center justify-center opacity-20 gap-2">
              <i class="ph ph-database text-4xl"></i><span class="text-xs">Empty</span>
          </div>
          <div x-show="docCount > 0 || currentDoc" class="h-full">
              <div class="mockup-code shadow-sm w-full h-full rounded-md overflow-auto border border-white/5 bg-gray-950"
                   :class="currentDoc ? 'text-blue-300' : 'text-emerald-400'">
                  <pre class="px-4 py-2 text-[10px]"><code x-text="currentDoc ? JSON.stringify(currentDoc, null, 2) : getIndexPreview()"></code></pre>
              </div>
          </div>
      </div>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('extractor', () => ({
    targetUrl: 'https://lawfilesext.leg.wa.gov/Biennium/2025-26/Htm/Bills/House%20Bills/',
    files: [], masterIndex: { dict: {}, inv: [] },
    docCount: 0, termCount: 0, processedUrls: new Set(),
    currentDoc: null, db: null, dbStatus: '...',
    scanning: false, batchScanning: false, analyzing: false,
    copyText: 'Copy', table: null, lastStoredUrl: null,

    getStoredCount() { return this.files.filter(f => this.processedUrls.has(f.url)).length; },
    showIndex() { this.currentDoc = null; },

    getIndexPreview() {
        return JSON.stringify({
            dict: _.pick(this.masterIndex.dict, _.keys(this.masterIndex.dict).slice(0, 100)),
            inv: `[${this.masterIndex.inv.length} items...]`,
            _meta: { totalTerms: this.termCount, preview: "Summarized" }
        }, null, 2);
    },

    async init() {
        try {
            this.db = new Dexie('SessionBills');
            this.db.version(3).stores({ documents: '++id, &url', meta: '' });
            await this.db.open();
            this.dbStatus = `v${this.db.verno}`;
            const meta = await this.db.meta.get('masterIndex');
            if (meta) { this.masterIndex = meta; this.termCount = Object.keys(meta.dict).length; }
            (await this.db.documents.orderBy('url').keys()).forEach(u => this.processedUrls.add(u));
            this.docCount = this.processedUrls.size;
        } catch (e) { this.dbStatus = 'Error'; }
        this.initTable();
    },

    initTable() {
        this.table = new Tabulator("#fileTable", {
            data: [], layout: "fitColumns", height: "400", index: "url",
            selectableRows: 1, 
            columns: [{ 
                title: "Filename", field: "filename", headerFilter:"input",
                formatter: (cell) => {
                    const isDone = this.processedUrls.has(cell.getRow().getData().url);
                    const icon = isDone ? `<i class="ph ph-check-circle text-success"></i>` : `<i class="ph ph-file opacity-20"></i>`;
                    return `<div class="flex items-center gap-2 py-0.5 cursor-pointer text-[11px]">${icon} <span class="${isDone ? 'opacity-100' : 'text-primary font-bold'}">${cell.getValue()}</span></div>`;
                }
            }]
        });

        this.table.on("rowSelectionChanged", (data, rows) => {
            if (rows[0]) this.viewFile(rows[0].getData().url, rows[0]);
        });

        this.table.on("tableBuilt", () => {
            const el = this.table.element;
            el.tabIndex = 0;
            el.onkeydown = e => {
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    this.nav(e.key === 'ArrowUp');
                }
            };
        });
    },

    nav(up) {
        const s = this.table.getSelectedRows()[0];
        const next = s ? (up ? s.getPrevRow() : s.getNextRow()) : this.table.getRows()[0];
        if (next) {
            this.table.deselectRow();
            next.select();
            // Scroll logic matches the AIC example
            this.table.scrollToRow(next, 'nearest', false);
        }
    },

    smartScroll() {
        const row = this.table.getRow(this.lastStoredUrl) || 
                    this.table.getRows("active").find(r => !this.processedUrls.has(r.getData().url));
        if (row) {
            this.table.deselectRow();
            row.select();
            this.table.scrollToRow(row, "center", true).then(() => {
                const el = row.getElement();
                el.style.backgroundColor = 'rgba(var(--p), 0.15)';
                setTimeout(() => el.style.backgroundColor = '', 800);
            });
        }
    },

    async viewFile(url, row) {
        const cached = await this.db.documents.where('url').equals(url).first();
        if (cached) {
            this.currentDoc = this.hydrateDoc(cached);
        } else {
            const rawBill = await this.extract(url);
            if(rawBill && !rawBill.error) {
                await this.ingestAndSave(rawBill);
                if(row) row.reformat();
                this.currentDoc = rawBill;
            }
        }
    },

    hydrateDoc(doc) {
        const idToTerm = [];
        Object.entries(this.masterIndex.dict).forEach(([t, id]) => idToTerm[id] = t);
        if (doc.terms) doc.terms = doc.terms.map(id => idToTerm[id]);
        return doc;
    },

    async ingestAndSave(rawBill) {
        const termIds = [];
        (rawBill.terms || []).forEach(term => {
            let tid = this.masterIndex.dict[term];
            if (tid === undefined) {
                tid = Object.keys(this.masterIndex.dict).length;
                this.masterIndex.dict[term] = tid;
                this.masterIndex.inv[tid] = [];
            }
            termIds.push(tid);
        });
        const docId = await this.db.documents.add({ ...rawBill, terms: termIds });
        [...new Set(termIds)].forEach(tid => this.masterIndex.inv[tid].push(docId));
        await this.db.meta.put(JSON.parse(JSON.stringify(this.masterIndex)), 'masterIndex');
        this.processedUrls.add(rawBill.url);
        this.lastStoredUrl = rawBill.url; 
        this.docCount++; this.termCount = Object.keys(this.masterIndex.dict).length;
    },

    async startBatchScan() {
        this.batchScanning = true;
        for (const row of this.table.getRows("active")) {
            if (!this.batchScanning) break;
            const url = row.getData().url;
            if (this.processedUrls.has(url)) continue;
            const raw = await this.extract(url);
            if (raw && !raw.error) { await this.ingestAndSave(raw); row.reformat(); }
            await new Promise(r => setTimeout(r, 120));
        }
        this.batchScanning = false;
    },

    stopBatchScan() { this.batchScanning = false; },

    copyVisibleData() {
        navigator.clipboard.writeText(JSON.stringify(this.currentDoc || this.masterIndex, null, 2)).then(() => {
            this.copyText = "Done";
            setTimeout(() => this.copyText = "Copy", 1200);
        });
    },

    async scanDirectory() {
        this.scanning = true; this.files = []; this.lastStoredUrl = null; this.table.clearData();
        try {
            const res = await fetch(this.targetUrl);
            const html = await res.text();
            this.files = Array.from(new DOMParser().parseFromString(html, 'text/html').querySelectorAll('a'))
                .map(a => ({ filename: a.textContent.trim(), url: new URL(a.getAttribute('href'), this.targetUrl).href }))
                .filter(f => (f.filename.endsWith('.htm') || f.filename.endsWith('.pdf')) && !f.filename.includes('..'));
            this.table.replaceData(this.files);
        } catch (e) { console.error(e); }
        this.scanning = false;
    },

    async extract(fileUrl) {
        this.analyzing = true;
        try {
            const htmUrl = fileUrl.replace(/\b(xml|pdf)\b/g, 'htm');
            const res = await fetch(htmUrl);
            const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
            const clean = (t) => t?.textContent.trim() || 'N/A';
            const readSpan = Array.from(doc.querySelectorAll('span')).find(s => s.textContent.trim().startsWith('Read first time'));
            const data = {};
            if (readSpan) (readSpan.closest('div') || readSpan.parentElement).querySelectorAll('span').forEach(s => {
                const t = s.textContent.trim();
                if (t.startsWith('Prefiled')) data.prefiled = t.split('Prefiled ')[1];
                if (t.startsWith('Read first time')) data.firstRead = t.split('Read first time ')[1];
                if (t.startsWith('Referred to')) data.referredTo = t.split('Referred to ')[1];
            });
            const fullBill = clean(doc.querySelector('div[style*="bold;text-align:center;"]'));
            return {
                url: htmUrl, ...data, billNumber: fullBill, billNo: fullBill.match(/\d+/)?.[0] || 'N/A',
                sponsors: doc.querySelector('span[style*="font-weight:bold"]')?.nextSibling?.textContent.trim() || 'N/A',
                title: doc.querySelector('div[style*="text-indent:0.5in;margin-top:0.5in;"]')?.innerHTML.trim() || 'N/A',
                terms: [...new Set(doc.body.textContent.toLowerCase().match(/[a-z]{3,}/g) || [])].sort()
            };
        } catch (e) { return { error: e.message }; } finally { this.analyzing = false; }
    }
  }));
});
</script>
</body>
</html>
