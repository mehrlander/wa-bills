<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strip Index</title>
  <link href="https://cdn.jsdelivr.net/combine/npm/daisyui@5/themes.css,npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-base-200 min-h-screen p-4">

  <div tabindex="0" id="paste" class="bg-base-100 border-2 border-dashed border-base-300 p-6 text-center cursor-pointer hover:border-primary focus:border-primary focus:outline-none">
    <p class="opacity-50">Click here and paste (Ctrl+V)</p>
  </div>

  <div id="buttons" class="mt-4 flex gap-4 hidden">
    <button id="copyMain" class="btn btn-primary">Copy without xmlHeading</button>
    <button id="copyFlat" class="btn btn-secondary">Copy flattened xmlHeading</button>
  </div>

  <script>
    let mainData, flatData;
    const path = url => new URL(url).pathname;
    
    document.getElementById('paste').addEventListener('paste', e => {
      e.preventDefault();
      try {
        const {documents} = JSON.parse(e.clipboardData.getData('text'));
        
        mainData = documents.map(({terms, masterIndex, xmlHeading, url, ...d}) => ({url: path(url), ...d}));
        
        flatData = documents.map(({url, xmlHeading}) => ({url: path(url), ...xmlHeading}));
        
        document.getElementById('buttons').classList.remove('hidden');
      } catch(err) { alert('Parse error: ' + err.message); }
    });
    
    document.getElementById('copyMain').onclick = () => {
      navigator.clipboard.writeText(JSON.stringify(mainData, null, 2));
    };
    
    document.getElementById('copyFlat').onclick = () => {
      navigator.clipboard.writeText(JSON.stringify(flatData, null, 2));
    };
    
    document.getElementById('paste').focus();
  </script>
</body>
</html>
