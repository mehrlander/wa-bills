<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legislation Tracker</title>
    <script src="https://cdn.jsdelivr.net/combine/npm/jquery,npm/jszip,npm/tabulator-tables,npm/@tailwindcss/browser@4,npm/clipboard,npm/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables/dist/css/tabulator_simple.min.css">
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans bg-slate-100 text-slate-900">

<header id="hdr" class="flex-none shadow-md z-10 bg-slate-800">
    <div class="flex flex-nowrap items-center gap-3 p-2 border-b border-slate-900 overflow-x-auto">
        <div class="flex flex-nowrap items-center gap-1.5 shrink-0">
            <input type="date" id="d" value="2025-03-01" class="h-7 px-2 text-[11px] bg-slate-700 border border-slate-600 rounded outline-none text-white w-28 shrink-0">
            <button id="b" title="Load Data" class="h-7 w-8 flex items-center justify-center bg-blue-600 border border-blue-500 rounded hover:bg-blue-500 cursor-pointer text-white transition-colors shrink-0"><i class="ph-bold ph-cloud-arrow-down"></i></button>
            <button id="copy" title="Copy Selected" class="h-7 w-8 flex items-center justify-center bg-slate-600 border border-slate-500 rounded hover:bg-slate-500 cursor-pointer text-white transition-colors shrink-0"><i class="ph-bold ph-copy"></i></button>
        </div>
        <div class="h-5 w-px bg-slate-700 shrink-0 mx-1"></div>
        <button id="raw-toggle" title="Toggle Raw View" class="h-7 px-3 flex flex-nowrap items-center gap-2 text-[11px] font-bold bg-slate-700 border border-slate-600 rounded hover:bg-slate-600 cursor-pointer text-slate-300 transition-all shrink-0"><i class="ph-bold ph-code"></i><span>RAW</span></button>
        <span id="s" class="ml-auto text-[10px] text-slate-400 font-bold uppercase tracking-widest px-2 shrink-0"></span>
    </div>
    <div id="filters" class="flex flex-nowrap items-center gap-4 p-2 bg-white border-b border-slate-300 overflow-x-auto whitespace-nowrap">
        <div class="flex flex-nowrap items-center gap-2 shrink-0">
            <i class="ph ph-magnifying-glass text-slate-400 text-sm"></i>
            <input type="text" id="q" placeholder="Filter bills..." class="h-7 px-2 text-xs border border-slate-200 rounded w-24 outline-none focus:ring-1 focus:ring-blue-100 text-slate-900">
        </div>
        <div class="flex flex-nowrap items-center gap-1.5 shrink-0">
            <i class="ph ph-lightning text-slate-400 text-sm" title="Action Since"></i>
            <input type="date" id="fDate" class="h-7 px-2 text-xs border border-slate-200 rounded outline-none focus:ring-1 focus:ring-blue-100 text-slate-900 w-28">
        </div>
        <div id="toggles" class="flex flex-nowrap items-center gap-4 shrink-0"></div>
    </div>
</header>

<main class="flex-1 flex flex-col min-h-0">
    <div id="processed-view" class="view-pane flex flex-col h-full active">
        <div id="t2" class="flex-none bg-white"></div>
        <div class="h-0.5 bg-slate-400 shrink-0"></div>
        <div class="flex flex-col md:flex-row flex-1 min-h-0 p-2 gap-2 bg-slate-100">
            <pre id="t2-sel" class="flex-1 overflow-auto p-2 text-[11px] bg-white border border-slate-200 rounded shadow-sm"></pre>
            <pre id="t2-grp" class="flex-1 overflow-auto p-2 text-[11px] bg-white border border-slate-200 rounded shadow-sm"></pre>
        </div>
    </div>
    <div id="raw-view" class="view-pane hidden flex-col h-full">
        <div id="t1" class="flex-none bg-white"></div>
        <div class="h-0.5 bg-slate-400 shrink-0"></div>
        <div class="flex-1 min-h-0 p-2 bg-slate-100">
            <pre id="t1-sel" class="h-full overflow-auto p-2 text-[11px] bg-white border border-slate-200 rounded shadow-sm"></pre>
        </div>
    </div>
</main>

<script type="module">
const [{ XMLParser }, { flatten }] = await Promise.all([
    import('https://cdn.jsdelivr.net/npm/fast-xml-parser/+esm'),
    import('https://cdn.jsdelivr.net/npm/flat/+esm')
]);

const tog = l => `<label class="flex items-center gap-1.5 text-xs font-bold text-slate-600 cursor-pointer"><input type="checkbox" id="f${l}" class="w-4 h-4 accent-blue-600"> ${l}</label>`;
$('#toggles').html(['App', 'Cur', 'Pre'].map(tog).join(''));

const cmMap = { APPROPRIATIONS: "APP", "WAYS & MEANS": "WM", FINANCE: "FIN", TRANSPORTATION: "TRAN", "HEALTH & LONG-TERM CARE": "HLTC", "HUMAN SERVICES": "HS", "LAW & JUSTICE": "L&J", "AGRICULTURE & NATURAL RESOURCES": "AGNR", "LABOR & COMMERCE": "L&C", "LABOR & WORKPLACE STANDARDS": "LWS", "COMMUNITY SAFETY": "CS", "POSTSECONDARY EDUCATION & WORKFORCE": "PEW", "STATE GOVERNMENT & TRIBAL RELATIONS": "SGTR", "CONSUMER PROTECTION & BUSINESS": "CPB", "ENVIRONMENT, ENERGY & TECHNOLOGY": "EET", "EARLY LEARNING & K-12 EDUCATION": "ELK12", "HIGHER EDUCATION & WORKFORCE DEVELOPMENT": "HEWD", "CAPITAL BUDGET": "CAP", "CIVIL RIGHTS & JUDICIARY": "CRJ", EDUCATION: "ED", "ENVIRONMENT & ENERGY": "E&E", "HEALTH CARE & WELLNESS": "HCW", HOUSING: "HSG", "LOCAL GOVERNMENT": "LG", "TECHNOLOGY, ECONOMIC DEVELOPMENT, & VETERANS": "TEDV", "BUSINESS, FINANCIAL SERVICES & TRADE": "BFST", "EARLY LEARNING & HUMAN SERVICES": "ELHS" };

const pillColors = { ENACTED: '#166534', VETOED: '#991b1b', SUBSTITUTED: '#475569', CONFIRMED: '#075985', PREFILED: '#475569', PASSED: '#6b21a8', FLOOR: '#334155', RULES: '#1e40af', 'RULES X': '#9f1239', FISCAL: '#854d0e' };
const pill = (txt, color) => `<span style="background:${color}11;color:${color};border:1px solid ${color}33;padding:1px 6px;border-radius:4px;font-size:.75rem;font-weight:500;margin-right:8px">${txt}</span>`;
const check = v => v ? '<div style="color:#16a34a;font-weight:bold">✓</div>' : '';
const wrap = (content, align = 'center') => `<div class="flex items-center justify-${align} w-full h-full text-[.8rem] whitespace-nowrap overflow-hidden text-ellipsis">${content}</div>`;

const pillStyle = cat => {
    for (let [k, c] of Object.entries(pillColors)) if (cat.includes(k)) return c;
    return /APP|WM|FIN/.test(cat) ? pillColors.FISCAL : '#475569';
};

const categorize = (s = '', a = '') => {
    const lc = (s + ' ' + a).toLowerCase(), ch = /^[HS]/.test(s) ? s[0] + '-' : '';
    if (/vetoed/.test(lc)) return 'VETOED';
    if (/^c |^chapter/.test(lc)) return 'ENACTED';
    if (/substituted/.test(lc)) return 'SUBSTITUTED';
    if (/confirmed/.test(lc)) return 'CONFIRMED';
    if (/prefiled/.test(lc)) return ch + 'PREFILED';
    if (/rules/.test(lc)) {
        const rt = /rules 3/.test(lc) ? 'RULES 3' : /rules x/.test(lc) ? 'RULES X' : 'RULES 2';
        const sub = /consideration/.test(lc) ? ' CON' : /review/.test(lc) ? ' REV' : /resolution/.test(lc) ? ' RES' : '';
        return ch + rt + sub;
    }
    if (/referred to/.test(lc)) {
        const nm = (a.match(/referred to ([^.]+)/i) || [])[1]?.trim().toUpperCase() || 'COMM';
        return ch + (cmMap[nm] || nm) + (/first reading/.test(lc) ? ' 1' : '');
    }
    if (/reading/.test(lc)) return ch + 'FLOOR';
    if (/passed 3rd/.test(lc)) return ch + 'PASSED';
    return 'OTHER';
};

const dateStr = d => d?.split?.('T')[0] || d;
const norm = t => t === true ? 1 : t === false ? 0 : typeof t === 'string' ? (t.startsWith('0001') ? null : t.trim().replace(/T00:00:00$/, '')) : t;
const shorten = s => s.replace(/^CurrentStatus\./, 'cs.').replace(/^ShortLegislationType\./, 'slt.').replace(/^Companions\./, 'comp.');
const findArray = o => Array.isArray(o) ? o : o && typeof o === 'object' ? Object.values(o).map(findArray).find(Boolean) : null;
const yearOf = s => s ? +String(s).slice(0, 4) : null;

const transform = recs => {
    const groups = new Map();
    recs.filter(r => r['slt.ShortLegislationType']?.trim() === 'B').forEach(r => {
        const cId = r['comp.Companion.BillId'] || r['comp.Companion'], cNum = cId ? parseInt(cId.replace(/\D/g, '')) : null;
        const pair = cNum ? [r.BillNumber, cNum].sort((a, b) => a - b).join(' / ') : String(r.BillNumber);
        (groups.get(pair) || groups.set(pair, []).get(pair)).push(r);
    });
    return [...groups].flatMap(([pair, vs]) => {
        vs.sort((a, b) => a.BillNumber - b.BillNumber || a.SubstituteVersion - b.SubstituteVersion || a.EngrossedVersion - b.EngrossedVersion);
        const f = vs[0], passedId = vs.find(v => /^C |^Chapter/.test(v['cs.Status'] || ''))?.BillId, nowYr = new Date().getFullYear();
        const current = vs.some(v => {
            const cat = categorize(v['cs.Status'] || '', v['cs.HistoryLine'] || ''), ay = yearOf(v['cs.ActionDate']), iy = yearOf(v.IntroducedDate);
            return ay === nowYr || iy === nowYr || ((ay === nowYr - 1 || iy === nowYr - 1) && cat.includes('PREFILED'));
        }) ? 1 : 0;
        return vs.map(r => ({
            group: pair, groupDesc: f.ShortDescription || '', longDesc: r.LongDescription || f.ShortDescription || '',
            passedId, num: Math.min(...vs.map(v => v.BillNumber)),
            ver: r.BillId || '', status: r['cs.Status'], actionLine: r['cs.HistoryLine'], active: r.Active == 1,
            sponsor: (r.Sponsor || '').match(/\(([^)]+)\)/)?.[1] || r.Sponsor,
            intro: dateStr(r.IntroducedDate), action: dateStr(r['cs.ActionDate']),
            fn: [r.StateFiscalNote && 'SFN', r.LocalFiscalNote && 'Loc'].filter(Boolean).join(',') || null,
            req: ['G', 'D', 'B', 'O'].filter((_, i) => [r.RequestedByGovernor, r.RequestedByDepartment, r.RequestedByBudgetCommittee, r.RequestedByOther][i] == 1).join('') || null,
            approp: r.Appropriations == 1 ? 1 : 0, current,
            prefiled: categorize(r['cs.Status'] || '', r['cs.HistoryLine'] || '').includes('PREFILED') ? 1 : 0
        }));
    }).sort((a, b) => a.num - b.num);
};

const fmtJSON = x => x ? JSON.stringify(x, null, 2) : "// No record selected";
let tableRaw, tableProc, fullRawData = [], fullProcData = [], currentView = 'processed';

new ClipboardJS('#copy', {
    text: () => JSON.stringify((currentView === 'processed' ? tableProc : tableRaw)?.getData("active") || [], null, 2)
}).on("success", () => {
    const icon = $('#copy i')[0];
    icon.className = 'ph-bold ph-check text-green-400';
    setTimeout(() => icon.className = 'ph-bold ph-copy', 1200);
});

$('#raw-toggle').on('click', function() {
    const toRaw = !$(this).hasClass('bg-blue-600');
    $(this).toggleClass('bg-blue-600 text-white border-blue-500', toRaw).toggleClass('bg-slate-700 text-slate-300 border-slate-600', !toRaw);
    currentView = toRaw ? 'raw' : 'processed';
    $('.view-pane').addClass('hidden').removeClass('flex');
    $(`#${currentView}-view`).removeClass('hidden').addClass('flex');
    (toRaw ? tableRaw : tableProc)?.redraw();
});

$('#fDate').val($('#d').val());
$('#d').on('change', function() { $('#fDate').val($(this).val()); });

const applyFilters = () => {
    const q = $('#q').val().toLowerCase(), onlyA = $('#fApp').is(':checked'), onlyC = $('#fCur').is(':checked'), onlyP = $('#fPre').is(':checked'), since = $('#fDate').val();
    if (tableProc) {
        const validGroups = new Set(), gd = new Map();
        fullProcData.forEach(r => (gd.get(r.group) || gd.set(r.group, []).get(r.group)).push(r));
        for (let [gn, rows] of gd) {
            if ((!q || rows.some(r => (gn + r.groupDesc + r.status + r.sponsor + r.ver).toLowerCase().includes(q))) &&
                (!onlyA || rows.some(r => r.approp)) && (!onlyC || rows.some(r => r.current)) && (!onlyP || rows.some(r => r.prefiled)) &&
                (!since || rows.some(r => r.action >= since))) validGroups.add(gn);
        }
        tableProc.setFilter(r => validGroups.has(r.group));
        $('#s').text(`${validGroups.size} GROUPS`);
    }
    if (tableRaw) tableRaw.setFilter(r => (!q || Object.values(r).some(v => String(v).toLowerCase().includes(q))) && (!onlyA || r.Appropriations == 1) && (!onlyC || r.Active == 1) && (!since || r['cs.ActionDate'] >= since));
};

$('#q, #fApp, #fCur, #fPre, #fDate').on('input change', applyFilters);

$('#b').on('click', async () => {
    $('#s').text('FETCHING...');
    const dv = new Date($('#d').val()), ds = `${dv.getMonth() + 1}/${dv.getDate()}/${dv.getFullYear()}`;
    const resps = await Promise.all([`/LegislationService.asmx/GetLegislationIntroducedSince?sinceDate=${ds}`, `/LegislationService.asmx/GetPrefiledLegislation`].map(u => fetch(u).then(r => r.text())));
    const parser = new XMLParser(), seen = new Set();
    fullRawData = resps.flatMap(x => findArray(parser.parse(x)) || []).filter(r => !seen.has(r.BillId) && seen.add(r.BillId))
        .map(o => Object.fromEntries(Object.entries(flatten(o)).map(([k, v]) => [shorten(k), norm(v)])));

    tableRaw = new Tabulator('#t1', { data: fullRawData, height: 400, layout: 'fitData', selectableRows: 1, columns: [...new Set(fullRawData.flatMap(Object.keys))].sort().map(f => ({ title: f, field: f, maxWidth: 300 })) })
        .on("rowSelectionChanged", d => $('#t1-sel').text(fmtJSON(d[0])));

    fullProcData = transform(fullRawData);

    const cols = { ver: { width: 100 }, status: { maxWidth: 800, hozAlign: 'left', formatter: c => {
        const { status: s = '', actionLine: a = '' } = c.getData(), cat = categorize(s, a);
        if (cat === 'OTHER') return wrap([s, a].filter(Boolean).join(' | '), 'left');
        const eff = cat === 'ENACTED' ? (a.match(/\d{1,2}\/\d{1,2}\/\d{4}/) || ['TBD'])[0] : null;
        const txt = eff ? `Eff: ${eff}` : cat;
        const rest = eff ? a.replace(/Effective date\s+\d{1,2}\/\d{1,2}\/\d{4}\.?\s*/i, '').trim() : '';
        return wrap(pill(txt, pillStyle(cat)) + rest, 'left');
    }}, sponsor: { width: 120 }, intro: { width: 95, formatter: c => {
        const v = c.getValue(), cur = c.getData().current;
        if (!v) return '';
        const txt = cur ? new Date(v + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : v;
        return wrap(`<span style="${cur ? 'background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;font-weight:700' : 'color:#64748b'};padding:1px 6px;border-radius:4px;font-size:.75rem">${txt}</span>`);
    }}, action: {}, approp: { width: 60, formatter: c => check(c.getValue()) }, current: { width: 60, formatter: c => check(c.getValue()) }, prefiled: { width: 60, formatter: c => check(c.getValue()) }};
    cols.action = { ...cols.intro, width: 95 };

    tableProc = new Tabulator('#t2', {
        data: fullProcData, height: 400, layout: 'fitData', groupBy: "group", selectableRows: 1,
        groupHeader: (v, n, d) => {
            const passed = d[0].passedId;
            const links = v.split(' / ').map(num => `<a href="https://app.leg.wa.gov/billsummary?BillNumber=${num.trim()}&Year=2025" target="_blank" style="color:#2563eb;font-weight:bold;text-decoration:underline">${num.trim()}</a>${passed?.includes(num.trim()) ? ' ✓' : ''}`).join(' / ');
            return `${links} - <span style="font-weight:normal;color:#475569;cursor:help;border-bottom:1px dotted #94a3b8">${d[0].groupDesc}</span> <span style="font-size:.7rem;color:#94a3b8;margin-left:4px">(${n})</span>`;
        },
        rowFormatter: r => { if (!r.getData().active) Object.assign(r.getElement().style, { opacity: .5, color: '#777' }); },
        columns: Object.entries(cols).map(([f, cfg]) => ({ title: f === 'prefiled' ? 'PRE' : f.toUpperCase(), field: f, hozAlign: 'center', vertAlign: 'middle', ...cfg }))
    });

    tableProc.on("renderComplete", () => tableProc.getGroups().forEach(g => {
        const passed = !!g.getRows()[0]?.getData().passedId;
        Object.assign(g.getElement().style, { backgroundColor: passed ? '#f0fdf4' : '#f1f5f9', borderLeft: `4px solid ${passed ? '#22c55e' : '#94a3b8'}` });
    }));

    tableProc.on("rowSelectionChanged", d => {
        $('#t2-sel').text(fmtJSON(d[0]));
        if (d[0]) {
            const grp = tableProc.getGroups().find(g => g.getKey() === d[0].group);
            $('#t2-grp').text(fmtJSON(grp ? { group: grp.getKey(), count: grp.getRows().length, data: grp.getRows().map(r => r.getData()) } : null));
        }
    });
    applyFilters();
});
</script>
</body>
</html>
